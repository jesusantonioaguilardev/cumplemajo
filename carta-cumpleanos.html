<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>¡Feliz Cumpleaños!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --kraft-dark:#a9793f;
    --kraft-mid:#c99a5e;
    --kraft-light:#e3c79a;
    --paper:#fbf3e2;
    --paper-shadow:#e9dcc0;
    --ink:#3b2a1d;
    --ink-soft:#6b5842;
    --pink:#e85d75;
    --marigold:#e8a33d;
    --teal:#2f9c95;
    --purple:#8b5fbf;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    background: radial-gradient(ellipse at top, #fff7ea 0%, #f3e2c2 55%, #e8cfa0 100%);
    font-family: 'Lora', serif;
    color: var(--ink);
    overflow-x: hidden;
  }

  .stage {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px 16px 60px;
    position: relative;
  }

  /* --- Papel picado bunting --- */
  .bunting {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    display: flex;
    justify-content: center;
    pointer-events: none;
    z-index: 5;
  }
  .bunting svg { display:block; }

  /* --- Intro copy --- */
  .intro-text {
    text-align: center;
    margin-bottom: 22px;
    z-index: 2;
  }
  .intro-text h1 {
    font-family: 'Caveat', cursive;
    font-weight: 700;
    font-size: clamp(2.2rem, 7vw, 3.4rem);
    margin: 0 0 4px;
    color: var(--pink);
    text-shadow: 1px 1px 0 rgba(0,0,0,0.05);
  }
  .intro-text p {
    margin: 0;
    color: var(--ink-soft);
    font-size: 1rem;
  }

  .name-field {
    margin: 14px 0 26px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    z-index: 2;
  }
  .name-field label {
    font-size: 0.85rem;
    color: var(--ink-soft);
    letter-spacing: 0.02em;
  }
  .name-field input {
    font-family: 'Lora', serif;
    font-size: 1rem;
    padding: 8px 14px;
    border: 1.5px solid var(--kraft-mid);
    border-radius: 8px;
    background: #fffdf8;
    color: var(--ink);
    width: 240px;
    max-width: 70vw;
    text-align: center;
  }
  .name-field input:focus {
    outline: 2px solid var(--teal);
    outline-offset: 1px;
  }

  /* --- Envelope --- */
  .envelope-wrap {
    position: relative;
    width: 320px;
    max-width: 86vw;
    aspect-ratio: 320 / 210;
    cursor: pointer;
    z-index: 3;
    perspective: 1200px;
    transition: opacity 0.5s ease, margin 0.5s ease, height 0.5s ease;
  }
  .envelope-wrap.done {
    opacity: 0;
    pointer-events: none;
    height: 0;
    margin: 0;
    overflow: hidden;
  }
  .envelope-wrap:focus-visible {
    outline: 3px solid var(--teal);
    outline-offset: 6px;
    border-radius: 10px;
  }

  .env-shadow {
    position: absolute;
    left: 6%;
    right: 6%;
    bottom: -14px;
    height: 18px;
    background: radial-gradient(ellipse at center, rgba(59,42,29,0.28) 0%, rgba(59,42,29,0) 72%);
    filter: blur(1px);
    transition: opacity 0.6s ease;
  }

  .envelope {
    position: absolute;
    inset: 0;
    overflow: hidden;
  }

  .env-back {
    position: absolute;
    inset: 0;
    background: linear-gradient(155deg, var(--kraft-mid), var(--kraft-dark));
    border-radius: 10px;
    box-shadow: 0 14px 26px -10px rgba(59,42,29,0.45);
  }

  .env-back::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 10px;
    background:
      linear-gradient(35deg, rgba(255,255,255,0.10), transparent 40%),
      repeating-linear-gradient(120deg, rgba(255,255,255,0.03) 0px, rgba(255,255,255,0.03) 2px, transparent 2px, transparent 6px);
  }

  .letter {
    position: absolute;
    left: 6%;
    right: 6%;
    top: 10%;
    height: 84%;
    background: var(--paper);
    border-radius: 6px 6px 3px 3px;
    box-shadow: 0 6px 14px rgba(59,42,29,0.25);
    transform: translateY(6%);
    transition: transform 1.1s cubic-bezier(.2,.8,.25,1);
    z-index: 2;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding-top: 14%;
    overflow: hidden;
    max-height: 100%;
  }
  .letter-peek {
    font-family: 'Caveat', cursive;
    font-size: 1.4rem;
    color: var(--pink);
    opacity: 0.85;
  }

  .env-pocket {
    position: absolute;
    inset: 0;
    z-index: 3;
    clip-path: polygon(0% 100%, 50% 42%, 100% 100%);
    background: linear-gradient(200deg, var(--kraft-mid), var(--kraft-dark) 80%);
  }
  .env-pocket::after{
    content:"";
    position:absolute; inset:0;
    background: linear-gradient(200deg, rgba(255,255,255,0.12), transparent 55%);
    clip-path: inherit;
  }

  .env-flap {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 56%;
    clip-path: polygon(0% 0%, 100% 0%, 50% 100%);
    background: linear-gradient(200deg, var(--kraft-light), var(--kraft-mid) 85%);
    transform-origin: top center;
    transform-style: preserve-3d;
    transition: transform 0.9s cubic-bezier(.4,.1,.2,1), filter 0.9s ease;
    z-index: 4;
    box-shadow: 0 2px 4px rgba(59,42,29,0.15);
  }

  .seal {
    position: absolute;
    top: 40%;
    left: 50%;
    width: 56px;
    height: 56px;
    background: radial-gradient(circle at 35% 30%, #f0768a, var(--pink) 70%);
    border-radius: 50%;
    transform: translate(-50%, -50%);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 3px 6px rgba(59,42,29,0.35), inset 0 -3px 6px rgba(0,0,0,0.15);
    z-index: 6;
    transition: transform 0.5s ease, opacity 0.5s ease;
  }
  .seal svg { width: 28px; height: 28px; }

  .hint {
    position: absolute;
    bottom: -34px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 0.85rem;
    color: var(--ink-soft);
    letter-spacing: 0.02em;
    transition: opacity 0.4s ease;
  }

  /* open state */
  .envelope-wrap.open .env-flap {
    transform: rotateX(180deg);
    filter: brightness(0.9);
  }
  .envelope-wrap.open .seal {
    opacity: 0;
    transform: translate(-50%, -50%) scale(0.5);
  }
  .envelope-wrap.open .letter {
    transform: translateY(-48%);
  }
  .envelope-wrap.open .env-shadow { opacity: 0.4; }
  .envelope-wrap.open .hint { opacity: 0; }

  /* --- Full card view --- */
  .card-view {
    position: relative;
    z-index: 2;
    width: min(560px, 92vw);
    margin-top: 36px;
    background: var(--paper);
    border-radius: 10px;
    box-shadow: 0 24px 50px -18px rgba(59,42,29,0.4), 0 2px 0 var(--paper-shadow);
    padding: 42px clamp(20px, 6vw, 52px) 40px;
    opacity: 0;
    transform: translateY(24px) scale(0.98);
    pointer-events: none;
    transition: opacity 0.7s ease, transform 0.7s cubic-bezier(.2,.8,.25,1);
  }
  .card-view.show {
    opacity: 1;
    transform: translateY(0) scale(1);
    pointer-events: auto;
  }

  .card-view::before {
    content: "";
    position: absolute;
    inset: 10px;
    border: 1px solid rgba(59,42,29,0.15);
    border-radius: 6px;
    pointer-events: none;
  }

  .mascot {
    display: block;
    width: 108px;
    height: auto;
    margin: -14px auto 10px;
  }

  .card-view h2 {
    font-family: 'Caveat', cursive;
    font-size: clamp(2.4rem, 8vw, 3.6rem);
    font-weight: 700;
    color: var(--pink);
    margin: 0 0 6px;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  .title-icon,
  .small-icon,
  .button-icon {
    display: inline-flex;
    width: 1.1em;
    height: 1.1em;
    vertical-align: middle;
  }

  .title-icon svg,
  .small-icon svg,
  .button-icon svg {
    width: 100%;
    height: 100%;
    display: block;
  }

  .card-view .to {
    font-size: 0.95rem;
    color: var(--ink-soft);
    margin: 0 0 22px;
    font-style: italic;
  }

  .card-view p.msg {
    font-size: 1.06rem;
    line-height: 1.7;
    margin: 0 0 16px;
    color: var(--ink);
  }

  .signoff {
    margin-top: 24px;
    font-family: 'Caveat', cursive;
    font-size: 1.6rem;
    color: var(--teal);
    display: flex;
    align-items: center;
    justify-content: flex-start;
    gap: 8px;
  }

  .card-controls {
    margin-top: 30px;
    display: flex;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
  }
  .card-controls button {
    font-family: 'Lora', serif;
    font-size: 0.9rem;
    padding: 10px 18px;
    border-radius: 999px;
    border: 1.5px solid var(--kraft-mid);
    background: #fffdf8;
    color: var(--ink);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: background 0.2s ease, transform 0.15s ease;
  }
  .card-controls button:hover { background: var(--kraft-light); }
  .card-controls button:active { transform: scale(0.97); }
  .card-controls button:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }

  canvas#confetti-canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 40;
  }

  .sr-only {
    position: absolute;
    width: 1px; height: 1px;
    padding: 0; margin: -1px;
    overflow: hidden;
    clip: rect(0,0,0,0);
    white-space: nowrap;
    border: 0;
  }

  @media (prefers-reduced-motion: reduce) {
    .env-flap, .letter, .env-shadow, .card-view, .seal { transition-duration: 0.01ms !important; }
  }
</style>
</head>
<body>

<canvas id="confetti-canvas" aria-hidden="true"></canvas>

<div class="stage">

  <div class="bunting" aria-hidden="true">
    <svg width="480" height="46" viewBox="0 0 480 46" xmlns="http://www.w3.org/2000/svg">
      <path d="M0,0 L480,0" stroke="#8a6a45" stroke-width="2" fill="none"/>
      <g>
        <polygon points="10,2 34,2 22,40" fill="#e85d75"/>
        <polygon points="46,2 70,2 58,40" fill="#e8a33d"/>
        <polygon points="82,2 106,2 94,40" fill="#2f9c95"/>
        <polygon points="118,2 142,2 130,40" fill="#8b5fbf"/>
        <polygon points="154,2 178,2 166,40" fill="#f2c94c"/>
        <polygon points="190,2 214,2 202,40" fill="#e85d75"/>
        <polygon points="226,2 250,2 238,40" fill="#2f9c95"/>
        <polygon points="262,2 286,2 274,40" fill="#e8a33d"/>
        <polygon points="298,2 322,2 310,40" fill="#8b5fbf"/>
        <polygon points="334,2 358,2 346,40" fill="#f2c94c"/>
        <polygon points="370,2 394,2 382,40" fill="#e85d75"/>
        <polygon points="406,2 430,2 418,40" fill="#2f9c95"/>
        <polygon points="442,2 466,2 454,40" fill="#e8a33d"/>
      </g>
    </svg>
  </div>

  <div id="intro-block">
    <div class="intro-text">
      <h1>Feliz cumpleaños</h1>
      <p>Toca el sobre para abrir tu carta</p>
    </div>
  </div>

  <div class="envelope-wrap" id="envelope" role="button" tabindex="0" aria-label="Abrir la carta de cumpleaños">
    <div class="env-shadow"></div>
    <div class="envelope">
      <div class="env-back"></div>
      <div class="letter"><span class="letter-peek">Feliz día</span></div>
      <div class="env-pocket"></div>
      <div class="env-flap"></div>
      <div class="seal">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 21c-4-3.5-8-6.9-8-11a5 5 0 0 1 9-3 5 5 0 0 1 9 3c0 4.1-4 7.5-8 11z" fill="#fff" opacity="0.9"/>
        </svg>
      </div>
    </div>
    <div class="hint">Haz clic para abrir</div>
  </div>

  <audio id="birthday-audio" src="las-mananitas.mp3" preload="auto"></audio>

  <section class="card-view" id="card-view" aria-live="polite">
    <img class="mascot" src="perrito.png" alt="Perrito con sombrero de fiesta y matraca de cumpleaños">
    <h2>
      <span class="title-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M8 6.5V4.8A2.8 2.8 0 0 1 10.8 2h2.4A2.8 2.8 0 0 1 16 4.8v1.7" stroke="#e85d75" stroke-width="1.6" stroke-linecap="round"/>
          <path d="M7 10.5h10a2 2 0 0 1 2 2V17a3 3 0 0 1-3 3H8a3 3 0 0 1-3-3v-4.5a2 2 0 0 1 2-2Z" fill="#f7d7a8" stroke="#d29b52" stroke-width="1.4"/>
          <path d="M9 10.5V8.2a1.2 1.2 0 0 1 1.2-1.2h3.6A1.2 1.2 0 0 1 15 8.2v2.3" stroke="#d29b52" stroke-width="1.4" stroke-linecap="round"/>
          <path d="M12 13.5v2.5M10.5 15h3" stroke="#d29b52" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </span>
      <span>Feliz Cumpleaños</span>
    </h2>
    <p class="to" id="to-line">Para Majo</p>
    <p class="msg">Que este año te traiga buenos momentos, personas agradables y mucho ánimo para seguir creciendo. Disfruta tu día y disfruta también de lo que llega después.</p>
  
    <p class="signoff">
      <span class="small-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 20.5c-4.5-3.2-8-6-8-10.2A4.5 4.5 0 0 1 8.5 6a4.7 4.7 0 0 1 3.5 1.7A4.7 4.7 0 0 1 15.5 6a4.5 4.5 0 0 1 4.5 4.3c0 4.2-3.5 7-8 10.2Z" fill="#2f9c95"/>
        </svg>
      </span>
      <span>Con cariño</span>
    </p>

    <div class="card-controls">
      <button id="replay-btn" type="button">
        <span class="button-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 3v3.2M12 17.8V21M4.9 12h3.2M15.9 12h3.2M6.7 6.7l2.3 2.3M14.9 14.9l2.3 2.3M17.3 6.7l-2.3 2.3M9.1 14.9l-2.3 2.3" stroke="#e85d75" stroke-width="1.7" stroke-linecap="round"/>
            <circle cx="12" cy="12" r="4.3" stroke="#e85d75" stroke-width="1.7"/>
          </svg>
        </span>
        <span>Más confeti</span>
      </button>
      <button id="music-btn" type="button">
        <span class="button-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M9 8.5v7.1a2.2 2.2 0 1 1-2.2-2.2H8l1-.1V8.5Zm7.8-2.4-2.8 1.1v9.5l2.8 1.1a2.2 2.2 0 1 0 1.2-4.2V8.8a2.2 2.2 0 0 0-1.2-3.7Z" fill="#2f9c95"/>
          </svg>
        </span>
        <span>Silenciar música</span>
      </button>
    </div>
  </section>

</div>

<script>
(function(){
  "use strict";

  var envelope = document.getElementById('envelope');
  var introBlock = document.getElementById('intro-block');
  var cardView = document.getElementById('card-view');
  var toLine = document.getElementById('to-line');
  var replayBtn = document.getElementById('replay-btn');
  var musicBtn = document.getElementById('music-btn');

  var opened = false;
  var musicMuted = false;

  function setMusicButtonLabel(){
    var icon = '<span class="button-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M9 8.5v7.1a2.2 2.2 0 1 1-2.2-2.2H8l1-.1V8.5Zm7.8-2.4-2.8 1.1v9.5l2.8 1.1a2.2 2.2 0 1 0 1.2-4.2V8.8a2.2 2.2 0 0 0-1.2-3.7Z" fill="#2f9c95"/></svg></span>';
    var mutedIcon = '<span class="button-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M7 10v4.4h2.5l3.5 3.1V6.5L9.5 9.6H7Zm10.4-1.6-1.5 1.5M16.9 13.9l1.5 1.5M16.9 10.3l1.5-1.5M15.4 12h2.5" stroke="#2f9c95" stroke-width="1.6" stroke-linecap="round"/><path d="M10.5 9.2v5.6" stroke="#2f9c95" stroke-width="1.6" stroke-linecap="round"/></svg></span>';
    musicBtn.innerHTML = (musicMuted ? mutedIcon : icon) + '<span>' + (musicMuted ? 'Reproducir música' : 'Silenciar música') + '</span>';
  }

  function openEnvelope(){
    if (opened) return;
    opened = true;
    envelope.classList.add('open');
    envelope.setAttribute('aria-label', 'Carta abierta');

    toLine.textContent = 'Para Majo';

    setTimeout(function(){
      introBlock.style.display = 'none';
      envelope.classList.add('done');
      cardView.classList.add('show');
      launchConfetti(220);
      playMananitas();
    }, 950);
  }

  envelope.addEventListener('click', openEnvelope);
  envelope.addEventListener('keydown', function(e){
    if (e.key === 'Enter' || e.key === ' '){
      e.preventDefault();
      openEnvelope();
    }
  });

  replayBtn.addEventListener('click', function(){
    launchConfetti(180);
  });

  musicBtn.addEventListener('click', function(){
    musicMuted = !musicMuted;
    setMusicButtonLabel();
    if (musicMuted){
      audioEl.pause();
    } else {
      playMananitas();
    }
  });

  setMusicButtonLabel();

  /* ---------------- Confetti ---------------- */
  var canvas = document.getElementById('confetti-canvas');
  var ctx = canvas.getContext('2d');
  var particles = [];
  var confettiColors = ['#e85d75', '#e8a33d', '#2f9c95', '#8b5fbf', '#f2c94c', '#fbf3e2'];
  var animId = null;
  var prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function resizeCanvas(){
    canvas.width = window.innerWidth * window.devicePixelRatio;
    canvas.height = window.innerHeight * window.devicePixelRatio;
    canvas.style.width = window.innerWidth + 'px';
    canvas.style.height = window.innerHeight + 'px';
    ctx.setTransform(window.devicePixelRatio, 0, 0, window.devicePixelRatio, 0, 0);
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  function makeParticle(){
    return {
      x: Math.random() * window.innerWidth,
      y: -20 - Math.random() * 200,
      w: 6 + Math.random() * 6,
      h: 8 + Math.random() * 10,
      color: confettiColors[Math.floor(Math.random() * confettiColors.length)],
      rot: Math.random() * Math.PI * 2,
      rotSpeed: (Math.random() - 0.5) * 0.2,
      vy: 2 + Math.random() * 3,
      vx: (Math.random() - 0.5) * 2.4,
      sway: Math.random() * Math.PI * 2,
      swaySpeed: 0.02 + Math.random() * 0.02,
      life: 0,
      maxLife: 420 + Math.random() * 200
    };
  }

  function launchConfetti(count){
    if (prefersReducedMotion) return;
    for (var i = 0; i < count; i++){
      particles.push(makeParticle());
    }
    if (!animId){
      animId = requestAnimationFrame(tickConfetti);
    }
  }

  function tickConfetti(){
    ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
    for (var i = particles.length - 1; i >= 0; i--){
      var p = particles[i];
      p.life++;
      p.sway += p.swaySpeed;
      p.x += p.vx + Math.sin(p.sway) * 1.2;
      p.y += p.vy;
      p.rot += p.rotSpeed;

      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      ctx.restore();

      if (p.y > window.innerHeight + 40 || p.life > p.maxLife){
        particles.splice(i, 1);
      }
    }
    if (particles.length > 0){
      animId = requestAnimationFrame(tickConfetti);
    } else {
      animId = null;
    }
  }

  /* ---------------- "Las Mañanitas" (audio file) ---------------- */
  var audioEl = document.getElementById('birthday-audio');
  audioEl.loop = true;
  audioEl.autoplay = true;
  audioEl.muted = false;

  function playMananitas(){
    if (musicMuted || !audioEl) return;
    audioEl.volume = 0.75;
    audioEl.muted = false;
    if (audioEl.paused) {
      audioEl.currentTime = 0;
    }
    var playPromise = audioEl.play();
    if (playPromise && playPromise.catch){
      playPromise.catch(function(){
        setTimeout(function(){
          if (!musicMuted && audioEl) {
            audioEl.play();
          }
        }, 300);
      });
    }
  }

})();
</script>

</body>
</html>
